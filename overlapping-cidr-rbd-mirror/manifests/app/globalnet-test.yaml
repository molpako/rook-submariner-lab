apiVersion: v1
kind: Namespace
metadata:
  name: __GLOBALNET_TEST_NAMESPACE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __GLOBALNET_TEST_APP__
  namespace: __GLOBALNET_TEST_NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: __GLOBALNET_TEST_APP__
  template:
    metadata:
      labels:
        app: __GLOBALNET_TEST_APP__
    spec:
      containers:
        - name: __GLOBALNET_TEST_APP__
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          command:
            - /agnhost
            - netexec
            - --http-port=8080
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: __GLOBALNET_TEST_SERVICE__
  namespace: __GLOBALNET_TEST_NAMESPACE__
spec:
  type: ClusterIP
  selector:
    app: __GLOBALNET_TEST_APP__
  ports:
    - name: http
      port: 80
      targetPort: http
